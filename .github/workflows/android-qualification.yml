name: Kemas Android Debug Qualification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: kemas-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Record Paparazzi snapshots
        run: ./gradlew --no-daemon recordPaparazziDebug

      - name: Verify Paparazzi snapshots
        if: always() && !cancelled()
        run: ./gradlew --no-daemon verifyPaparazziDebug

      - name: Run unit tests
        if: always() && !cancelled()
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        if: always() && !cancelled()
        run: ./gradlew --no-daemon assembleDebug

      - name: Assert package ID in assembled debug APK
        if: always() && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -1)
          test -n "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -1)
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.vanipy.kemas'"

      - name: Upload qualification outputs and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kemas-qualification-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/src/test/snapshots/images/**/*.png
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 5
